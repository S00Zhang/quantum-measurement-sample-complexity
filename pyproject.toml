[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qmsc"
version = "1.0.0"
description = "Sample complexity of generative learning of quantum measurement data: code and data behind arXiv:2610.38028"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Shuhan Zhang"}, {name = "Yi-Zhuang You"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["qmsc*"]
